---
- name: Reload SSH
  ansible.builtin.service:
    name: sshd
    state: reloaded

- name: Restart-docker
  ansible.builtin.service:
    name: docker
    state: reloaded

- name: Reload firewalld
  ansible.builtin.service:
    name: firewalld
    state: reloaded

- name: Restart crowdsec-firewall-bouncer
  ansible.builtin.service:
    name: crowdsec-firewall-bouncer
    state: restarted
